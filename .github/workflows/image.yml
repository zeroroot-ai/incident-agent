name: image
# Build + cosign-sign the incident-agent agent image from source, via the org's
# reusable image-build workflow — the same build-from-source + keyless-OIDC
# convention every other platform image uses.
#
# Why this exists: gibson's platform catalog (ADR-0136) references an agent by
# IMAGE DIGEST. Without a published, signed image there is no digest, so the
# incident-agent catalog manifest cannot be written at all — not because anyone
# disagrees about its contents, but because its central field has no value.
# This workflow produces that value. The manifest itself stays in gibson,
# beside the other catalog manifests.
#
# Trigger discipline: push:main (sha-tagged) + the release tag
# (release-please cuts `v*`; tag_pattern derives the semver image tag from it)
# + workflow_dispatch for a manual rebuild. Never on a pull request.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  image:
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@88cbc77697ff7143c98f29f3c4d80a93a666d601 # v0.23.0
    with:
      component_name: incident-agent
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/incident-agent
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      tag_pattern: type=match,pattern=v(.*)
      # VERSION is stamped into the binary, which reports it at registration.
      # Passing github.ref_name means a tagged build reports its release and a
      # main build reports the branch. Omitting it entirely would leave the
      # Dockerfile's `dev` default on every published image, which is
      # indistinguishable from a local build in the console and the registry.
      build_args: |
        VERSION=${{ github.ref_name }}
